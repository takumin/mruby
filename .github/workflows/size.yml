# What a build weighs, measured by `rake size` and compared against what
# `master` last weighed.
#
# Every configuration in the matrix reports into the run summary; one of them
# also comments. A comment per configuration is a comment nobody reads to the
# end, and it would arrive no sooner than the slowest of them, while the one
# that comments arrives as soon as it alone is done. The rest are a click away
# in the summary for the run, which is where a number worth chasing is chased.
#
# A pull request from a fork gets the summary and no comment: its run holds a
# read-only token, and reaching a write one from here would mean a second
# workflow posting on behalf of code this repository has not taken in. Work
# opened as a pull request here rather than from a fork is what the comment is
# for, which is the branch a change is read on before it goes upstream.
name: Size

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  measure:
    name: "Measure ${{ matrix.config }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # `default` is what a plain `rake` builds and the one that comments.
          # `minimal` is core alone without stdio, which is the floor a build
          # for a small machine is measured against and moves for reasons the
          # full build hides. `target` names the build directory the
          # configuration leaves the report in; a configuration declaring
          # several targets would be measured by the one named here.
          - {config: default, target: host}
          - {config: minimal, target: minimal}
    permissions:
      contents: read
      # Reading the baseline is reading the artifact of another run.
      actions: read
      pull-requests: write
    env:
      # The runner image and the compiler are held still, as the configuration
      # is: what a build weighs moves with all three, and a comparison against
      # a baseline measured by another of them reports that difference as
      # though the change had made it. `size:diff` says so when the two reports
      # disagree about the compiler, which is what a runner image update looks
      # like from here.
      MRUBY_CONFIG: ${{ matrix.config }}
      CC: gcc
      CXX: g++
      LD: gcc
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ruby version
        run: ruby -v
      - name: Compiler version
        run: ${{ env.CC }} --version
      - name: Build and measure
        run: rake -m size
      # The baseline is the last `master` run that measured itself and still
      # has the artifact to show for it. A run that has not finished is not
      # `success`, so a push to `master` compares against the push before it
      # rather than against itself.
      - name: Find the baseline on master
        id: baseline
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            let runs
            try {
              runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'size.yml',
                branch: 'master',
                event: 'push',
                status: 'success',
                per_page: 10,
              })
            } catch (error) {
              // A pull request that is itself what puts this workflow on
              // `master` is asking after a workflow that is not there yet.
              core.warning(`master has no size workflow to compare against: ${error.message}`)
              return
            }
            for (const run of runs.data.workflow_runs) {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              })
              const name = `size-report-${process.env.MRUBY_CONFIG}`
              if (artifacts.data.artifacts.some((a) => a.name === name && !a.expired)) {
                core.info(`baseline: run ${run.id} at ${run.head_sha}`)
                core.setOutput('run-id', String(run.id))
                return
              }
            }
            core.warning('master has no size report to compare against')
      - name: Download the baseline
        if: steps.baseline.outputs.run-id
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: size-report-${{ matrix.config }}
          run-id: ${{ steps.baseline.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: baseline
      # `size:diff` reads a baseline that is not there as no baseline, so the
      # report is written whether the step above ran or not.
      - name: Compare
        run: |
          rake "size:diff[baseline/size.json,build/${{ matrix.target }}/size.json,size-report.md]"
          cat size-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post the report
        if: >-
          matrix.config == 'default' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- mruby-size-report -->'
            const body = fs.readFileSync('size-report.md', 'utf8')
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })

            // One comment, edited by every push: a comment that is edited
            // notifies nobody, and a pull request of twenty pushes reads as
            // what it weighs now rather than as twenty reports of what it
            // weighed on the way there.
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker)
            )
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
      - name: Upload the size report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: size-report-${{ matrix.config }}
          path: build/${{ matrix.target }}/size.json
          # A pull request opened against a `master` older than this is left
          # without a baseline, so the retention is the longest one there is.
          retention-days: 90
