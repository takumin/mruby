# https://github.com/actions/runner-images#available-images
name: Build & Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  GCC-CLANG:
    name: "${{ matrix.os }}-${{ matrix.altname || matrix.cc }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {os: ubuntu-24.04, cc: gcc, cxx: g++}
          - {os: ubuntu-24.04, cc: clang, cxx: clang++}
          - {os: ubuntu-22.04, cc: gcc, cxx: g++}
          - {os: ubuntu-22.04, cc: clang, cxx: clang++}
          # The only runner where `char` is unsigned; the macOS runners are
          # ARM64 too but Apple's ABI keeps `char` signed.
          - {os: ubuntu-24.04-arm, cc: gcc, cxx: g++}
          - {os: macos-26, cc: clang, cxx: clang++}
          - {os: macos-15, cc: clang, cxx: clang++}
          - {os: windows-2025, cc: gcc, cxx: g++, altname: "mingw-gcc"}
          - {os: windows-2022, cc: gcc, cxx: g++, altname: "mingw-gcc"}
    env:
      MRUBY_CONFIG: ci/gcc-clang
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      LD: ${{ matrix.cc }}
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ruby version
        run: ruby -v
      - name: Compiler version
        run: ${{ env.CC }} --version
      - name: Build and test
        run: rake -m test:run:serial

  Sanitizer:
    # The standard suite under the address and undefined sanitizers, which is
    # what turns a use after free or a leak from something a passing test
    # hides into a failure. `detect_leaks` is on by default here (Linux), so
    # a test that leaks fails the job.
    name: "ubuntu-24.04-gcc-asan"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MRUBY_CONFIG: gcc-asan
      CC: gcc
      CXX: g++
      LD: gcc
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ruby version
        run: ruby -v
      - name: Compiler version
        run: ${{ env.CC }} --version
      - name: Build and test
        run: rake -m test:run:serial

  Alloc-Fault:
    # The fast gate on the allocation-failure driver: that it counts, that it
    # refuses, and that a refusal inside mrb_open() is survivable. The sweep
    # that walks every allocation of every scenario is too long for a pull
    # request and runs in alloc-fault.yml instead.
    name: "ubuntu-24.04-alloc-fault"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MRUBY_CONFIG: ci/alloc-fault
      CC: gcc
      CXX: g++
      LD: gcc
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ruby version
        run: ruby -v
      - name: Build
        run: rake -m
      - name: Drive the fault injector
        run: rake test:run:bin

  Cosmopolitan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ruby version
        run: ruby -v
      - name: Cache cosmocc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-cosmocc
        with:
          path: ~/cosmo
          key: cosmocc-${{ runner.os }}-20260104
      - name: Install cosmocc
        if: steps.cache-cosmocc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/cosmo && cd ~/cosmo
          wget https://cosmo.zip/pub/cosmocc/cosmocc.zip
          unzip cosmocc.zip
      - name: Build and test
        run: |
          COSMO_ROOT=~/cosmo rake -m test:run:serial MRUBY_CONFIG=cosmopolitan

  Windows-VC:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      MRUBY_CONFIG: ci/msvc
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ruby version
        run: ruby -v
      - name: Build and test
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          rake -m test:run:serial
